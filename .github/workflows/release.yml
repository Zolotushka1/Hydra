name: Release

# Two independent tag families, because the panel and the agent are released on
# their own cadence: `panel-vX.Y.Z` and `node-vX.Y.Z`. The node install script
# pins artifact downloads to the `node-v` family, so a node asset published under
# any other tag will be refused by the node before it is fetched.
on:
  push:
    tags:
      - 'panel-v*'
      - 'node-v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the workspace from the tag
        id: target
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            panel-v*) workspace=panel ;;
            node-v*)  workspace=node ;;
            *)
              echo "tag $tag belongs to no known release family" >&2
              exit 1
              ;;
          esac
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "version=${tag#*-v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # The frontend is read from disk at run time, so the packaging script
      # refuses to run without it.
      - name: Build the frontend
        if: steps.target.outputs.workspace == 'panel'
        working-directory: panel
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build

      # The packaging script is the only place that decides what a release
      # contains and what the artifacts are called. Building here instead would
      # put that logic in two places, and the copy CI runs is the one nobody
      # executes by hand — so it is the one that drifts.
      - name: Package
        id: artifacts
        working-directory: ${{ steps.target.outputs.workspace }}
        run: |
          set -euo pipefail
          sh scripts/package-release.sh \
            "${{ steps.target.outputs.version }}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          cp -R dist/linux-x86_64/. "${GITHUB_WORKSPACE}/dist/"
          # A release asset is a file. The panel package carries the frontend as
          # a directory, so it travels as an archive that unpacks to `web/` beside
          # the binary — the layout the panel resolves by default.
          if [ -d "${GITHUB_WORKSPACE}/dist/web" ]; then
            tar -czf "${GITHUB_WORKSPACE}/dist/hydra-panel-web-linux-x86_64.tar.gz" \
              -C "${GITHUB_WORKSPACE}/dist" web
            rm -rf "${GITHUB_WORKSPACE}/dist/web"
          fi
          ( cd "${GITHUB_WORKSPACE}/dist" \
            && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\0' \
            | sort -z | xargs -0 sha256sum > SHA256SUMS )
          cat "${GITHUB_WORKSPACE}/dist/SHA256SUMS"

      # The artifact is what operators install, so it is checked as an artifact:
      # deployed to a directory unrelated to the source tree and started there.
      - name: Verify the package
        working-directory: ${{ steps.target.outputs.workspace }}
        run: sh scripts/verify-release-package.sh

      # The wire contract a consumer needs to know before upgrading. The versions
      # are read out of the registry table in panel/docs/api.md, which the
      # `published_schema_versions_match_the_documented_table` test keeps equal to
      # the registry in code — so this is a projection of the code, not a second
      # place to maintain the numbers.
      - name: Compose the release notes
        run: |
          set -euo pipefail
          {
            printf '## Schema versions\n\n'
            printf '| schema | version |\n|---|---|\n'
            for schema in node_runtime_config apply_plan node_provisioning_executor_contract protocol_capabilities; do
              row="$(grep -E "^\| \`${schema}\` \|" panel/docs/api.md || true)"
              if [ -z "$row" ]; then
                echo "schema $schema is missing from the registry table in panel/docs/api.md" >&2
                exit 1
              fi
              version="$(echo "$row" | awk -F'|' '{gsub(/ /, "", $3); print $3}')"
              printf '| `%s` | %s |\n' "$schema" "$version"
            done
            printf '\nA raised version means the document shape changed; see the versioning '
            printf 'policy in `panel/docs/api.md` for what each change class requires.\n\n'
            printf '## Checksums\n\n```\n'
            cat dist/SHA256SUMS
            printf '```\n'
          } > release-notes.md
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only regular files: a directory left in dist would fail the upload
          # halfway through, after the release object already exists.
          find dist -maxdepth 1 -type f -print0 \
            | xargs -0 gh release create "${GITHUB_REF_NAME}" \
                --title "${GITHUB_REF_NAME}" \
                --notes-file release-notes.md
