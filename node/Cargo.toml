[workspace]
members = [
    "crates/node-app",
    "crates/node-config",
    "crates/node-core",
    "crates/node-domain",
    "crates/node-session-adapter",
    "crates/node-session-adapter-client",
    "crates/node-session-driver-wireguard",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
hmac = "0.12.1"
axum = { version = "0.8.6", features = ["json"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sysinfo = "0.37.2"
tokio = { version = "1.51.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
