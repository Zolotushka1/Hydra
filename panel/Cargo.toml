[workspace]
members = [
    "crates/panel-app",
    "crates/panel-config",
    "crates/panel-core",
    "crates/panel-domain",
    "crates/panel-installer-executor",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.98"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
axum = "0.8.4"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
data-encoding = "2.9.0"
hmac = "0.12.1"
ipnet = "2.11.0"
rand = "0.9.2"
rcgen = { version = "0.13.2", features = ["x509-parser"] }
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23.38", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha1 = "0.10.6"
sha2 = "0.10.9"
sysinfo = "0.37.2"
thiserror = "2.0.12"
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread", "signal", "process", "time"] }
tower-http = { version = "0.6.6", features = ["trace", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
urlencoding = "2.1.3"
x25519-dalek = { version = "2.0.1", default-features = false, features = ["static_secrets"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"
