name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # One pinned Xray version for both workspaces: panel and agent render config for
  # the same binary, so testing them against different versions would let a render
  # mismatch go unnoticed.
  #
  # The minimum is duplicated in code as MINIMUM_XRAY_VERSION in
  # node/crates/node-core/src/lib.rs. When raising this, check that the constant
  # has not fallen behind.
  XRAY_VERSION: 26.6.27

jobs:
  # A panel change must not run the agent test suite and vice versa. Shared files
  # such as this workflow run both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      panel: ${{ steps.filter.outputs.panel }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            panel:
              - 'panel/**'
              - '.github/workflows/ci.yml'
            node:
              - 'node/**'
              - '.github/workflows/ci.yml'

  # The repository carries three copies of the licence: one at the root and one in
  # each workspace, so that `panel/` or `node/` stays complete when vendored on its
  # own. Copies drift silently, and a workspace shipping a different licence text
  # than the root is a licensing defect rather than a formatting one.
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Licence copies are byte-identical
        run: |
          set -euo pipefail
          root="$(sha256sum LICENSE | cut -d' ' -f1)"
          for copy in panel/LICENSE node/LICENSE; do
            actual="$(sha256sum "$copy" | cut -d' ' -f1)"
            if [ "$actual" != "$root" ]; then
              echo "$copy differs from the root LICENSE ($actual vs $root)" >&2
              exit 1
            fi
          done
          echo "all licence copies match $root"

  # Runs on every change, not behind the paths filter: a leak arrives with
  # whatever commit happens to carry it, and the file that leaks is by definition
  # not one the filter expects.
  tracked-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No runtime state is tracked
        run: sh scripts/check-tracked-files.sh

      # The check above matches on what a file is. This one matches on what is
      # inside it, because the leak it was written after was a value: three
      # subscription tokens, which would have passed the path check just as
      # easily inside fixture.json or a README.
      - name: No credential material in tracked contents
        run: python3 scripts/check-tracked-content.py

  # Every guard in this repository was written after something got past it, so
  # each one is broken on purpose here and required to notice. A guard nobody has
  # seen fail is a claim about its author's intent.
  mutation-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel
      - name: Guards notice when their property is broken
        run: python3 scripts/mutation-controls.py

  test:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: panel
            enabled: ${{ needs.changes.outputs.panel }}
          - workspace: node
            enabled: ${{ needs.changes.outputs.node }}
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.enabled == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.enabled == 'true'

      - uses: Swatinem/rust-cache@v2
        if: matrix.enabled == 'true'
        with:
          workspaces: ${{ matrix.workspace }}

      - name: Install pinned Xray
        if: matrix.enabled == 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q xray.zip xray -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          "$RUNNER_TEMP/xray/xray" version
          echo "HYDRA_TEST_XRAY_BINARY=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      # Tests that need an external binary execute a stub built from an example.
      # `cargo test` compiles examples only to hash-suffixed paths, so the plain
      # name the fixtures copy exists only after an explicit build. Skipping this
      # fails the suite on a cold cache while passing on a warm one.
      - name: Build test fixtures
        if: matrix.enabled == 'true'
        run: cargo build --workspace --examples

      - name: Test
        if: matrix.enabled == 'true'
        # HYDRA_REQUIRE_XRAY_TEST=1 forbids the real-Xray check from skipping
        # silently. That silent skip is what let the removed `allowInsecure` flag
        # and the missing Reality renderer survive a green run.
        env:
          HYDRA_REQUIRE_XRAY_TEST: "1"
        run: cargo test --workspace --all-targets

      - name: Clippy
        if: matrix.enabled == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The dashboard is read from disk at run time, so whether an operator gets
      # a working panel is a property of the release package rather than of the
      # code. Nothing in the test suite can see that. This builds a package,
      # deploys it to an unrelated directory, starts the binary and asks it for
      # the page and for the hashed asset the page references.
      - name: Verify the release package serves the frontend
        if: matrix.enabled == 'true' && matrix.workspace == 'panel'
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build
          sh scripts/verify-release-package.sh

      # The agent is installed as a single downloaded binary on a machine with no
      # source tree and no cargo, so it is checked the same way: packaged,
      # deployed elsewhere, started, asked for its local API.
      - name: Verify the release package runs where it is deployed
        if: matrix.enabled == 'true' && matrix.workspace == 'node'
        run: sh scripts/verify-release-package.sh

      # The Leptos frontend is a workspace of its own, so `cargo test --workspace`
      # above does not see it: it would otherwise be the one crate in the
      # repository that nothing builds, free to stop compiling unnoticed. It is
      # checked here on its own target instead.
      #
      # It also covers one third of keeping `panel-domain` usable from wasm: a
      # crate dependency that does not compile for the target fails here. The
      # other two are tests in panel-domain, because a build cannot see them:
      # `domain_source_is_free_of_host_only_apis` for std calls that compile into
      # stubs and fail at run time, and `dependencies_stay_minimal` for a crate
      # that compiles and then traps in the browser.
      - name: Frontend
        if: matrix.enabled == 'true' && matrix.workspace == 'panel'
        working-directory: panel/web-leptos
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          cargo fmt --all -- --check
          cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo build --target wasm32-unknown-unknown --release

      - name: Format
        if: matrix.enabled == 'true'
        run: cargo fmt --all -- --check
